spring.application.name=hotel-smart-booking-backend
server.address=0.0.0.0
server.port=8080
spring.docker.compose.enabled=false
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:21600000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
supabase.avatar-bucket=${SUPABASE_AVATAR_BUCKET:${SUPABASE_BUCKET:avt-image}}
supabase.roomtype-bucket=${SUPABASE_ROOMTYPE_BUCKET:roomtype-image}
supabase.ekyc-bucket=${SUPABASE_EKYC_BUCKET:ekyc-documents}

ai.service.ekyc-url=${AI_EKYC_URL}
ai.service.face-enroll-url=${AI_FACE_ENROLL_URL:http://localhost:8000/api/v1/face/enroll}
ai.service.face-verify-url=${AI_FACE_VERIFY_URL:http://localhost:8000/api/v1/face/verify}
ai.service.face-readiness-url=${AI_FACE_READINESS_URL:http://localhost:8000/api/v1/face/check-readiness}
ai.service.face-frame-validation-url=${AI_FACE_FRAME_VALIDATION_URL:http://localhost:8000/api/v1/face/validate-frame}

# PayPal Configuration
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.mode=${PAYPAL_MODE:sandbox}
paypal.api-url=${PAYPAL_API_URL:https://api-m.sandbox.paypal.com}
paypal.return-url=${PAYPAL_RETURN_URL:http://localhost:5173}
paypal.cancel-url=${PAYPAL_CANCEL_URL:http://localhost:5173}
paypal.conversion-rate=${PAYPAL_CONVERSION_RATE:25000.0}
# AES-256-GCM encryption key for sensitive data (idcardnumber)
# Generate with: openssl rand -base64 32
aes.secret-key=${AES_SECRET_KEY}

# HMAC-SHA256 key for idcardnumber duplicate detection (deterministic fingerprint)
# Must be different from AES key. Generate with: openssl rand -base64 32
hmac.secret-key=${HMAC_SECRET_KEY}
