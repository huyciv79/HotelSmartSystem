services:
  redis:
    image: 'redis:alpine'
    container_name: hotel-redis
    ports:
      - '6379:6379'
    restart: unless-stopped

  backend:
    build:
      context: ./hotel-smart-booking-backend
      dockerfile: Dockerfile
    container_name: hotel-backend
    ports:
      - '8080:8080'
    depends_on:
      - redis
    env_file:
      - ./hotel-smart-booking-backend/.env
    environment:
      - REDIS_HOST=redis
    restart: unless-stopped

  frontend:
    build:
      context: ./hotel-smart-booking-frontend
      dockerfile: Dockerfile
    container_name: hotel-frontend
    ports:
      - '5173:80'
    depends_on:
      - backend
    restart: unless-stopped
